      const reachable = idle && h.type !== 'foot' && h !== climber.hold && canReach(h);
      if (h.type === 'ledge') drawLedge(h, reachable || (idle && h === climber.hold));
      else drawHold(h, reachable);
    }
    if (missFx) {
      ctx.strokeStyle = COL.danger;
      ctx.globalAlpha = 1 - missFx.t / 0.35;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx(missFx.x), sy(missFx.y), 10 + missFx.t * 60, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    drawDynoPreview();
    drawCatchCue();
    drawClimber(climber);
    drawForeground();
    drawLighting();
    drawFloats();
    drawPumpVignette();
    if (state === 'dead') drawDead();
  }

  // =====================================================================
  // 12. HUD
  // =====================================================================
  const pumpFill = document.getElementById('pumpFill');
  const pumpBar = document.getElementById('pumpBar');
  const pumpText = document.getElementById('pumpText');
  const chalkBtn = document.getElementById('chalkBtn');
  const chalkCount = document.getElementById('chalkCount');
  let shownPump = -1, shownChalk = '';

  function updateMeters() {
    const p = Math.round(climber.pump);
    if (p !== shownPump) {
      shownPump = p;
      pumpFill.style.width = p + '%';
      pumpFill.style.backgroundColor = p < 45 ? 'var(--good)' : p < PUMP.hot ? 'var(--accent)' : 'var(--danger)';
      pumpText.textContent = p + '%';
      pumpBar.classList.toggle('hot', p >= 85);
    }
    const key = chalk.uses + ':' + chalk.t.toFixed(2);
    if (key !== shownChalk) {
      shownChalk = key;
      chalkCount.textContent = chalk.uses;
      chalkBtn.style.setProperty('--p', chalk.uses >= CHALK.max ? 1 : chalk.t.toFixed(3));
      chalkBtn.classList.toggle('empty', chalk.uses === 0);
    }
  }

  chalkBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    useChalk();
  });

  const hudGrade = document.getElementById('hudGrade');
  const hudZone = document.getElementById('hudZone');
  const hudNext = document.getElementById('hudNext');
  const toastEl = document.getElementById('toast');

  function showToast(big, sub, color) {
    document.getElementById('toastBig').textContent = big;
    document.getElementById('toastSub').textContent = sub || '';
    toastEl.querySelector('.big').style.color = color || '';
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }

  const hudHeight = document.getElementById('hudHeight');
  const hudBest = document.getElementById('hudBest');
  function updateHud(silent) {
    hudHeight.innerHTML = `${height}<small>m</small>`;
    if (height > save.data.best) { save.data.best = height; save.write(); }
    hudBest.textContent = `BEST ${save.data.best} m`;
    const g = Math.floor(height / GRADE_EVERY);
    hudGrade.textContent = `V${g}`;
    hudGrade.style.background = ZONES[zoneOf(g)].accent;
    hudZone.textContent = ZONES[zoneOf(g)].name;
    hudNext.style.width = `${((height - g * GRADE_EVERY) / GRADE_EVERY) * 100}%`;
    if (!silent) {
      hudHeight.classList.remove('pop');
      void hudHeight.offsetWidth;
      hudHeight.classList.add('pop');
    }
  }

  // =====================================================================
  // 13. MAIN LOOP
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    updateMeters();
    requestAnimationFrame(frame);
  }

  // Test hook (only with #debug in the URL)
  if (location.hash === '#debug') {
    window.__crux = { get climber() { return climber; }, get holds() { return holds; }, get state() { return state; }, get press() { return press; }, cam, sx, sy, canReach, toWorld, catchableHold: () => climber.dyno && climber.dyno.phase === 'fly' ? catchableHold() : null };
  }

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
